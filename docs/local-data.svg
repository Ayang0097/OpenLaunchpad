<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img"><title>OpenLaunchpad 功能图解</title><rect x="0" y="0" width="1200" height="380" rx="26" fill="#142435" stroke="none"/><text x="42" y="65" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="32" fill="#eaf2fa" font-weight="650">你的排列，保存在你的 Mac 上</text><rect x="42" y="125" width="324" height="140" rx="18" fill="#263d53" stroke="#4b667e"/><text x="66" y="178" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="24" fill="#eaf2fa" font-weight="600">应用程序目录</text><text x="66" y="225" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="19" fill="#b2c5d5" font-weight="400">扫描本机已安装应用</text><rect x="438" y="125" width="324" height="140" rx="18" fill="#263d53" stroke="#4b667e"/><text x="462" y="178" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="24" fill="#eaf2fa" font-weight="600">OpenLaunchpad</text><text x="462" y="225" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="19" fill="#b2c5d5" font-weight="400">搜索、分页、整理</text><rect x="834" y="125" width="324" height="140" rx="18" fill="#263d53" stroke="#4b667e"/><text x="858" y="178" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="24" fill="#eaf2fa" font-weight="600">本地布局文件</text><text x="858" y="225" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="19" fill="#b2c5d5" font-weight="400">保存页面、顺序与文件夹</text><text x="384" y="206" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="32" fill="#8cb4d8" font-weight="400">→</text><text x="780" y="206" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="32" fill="#8cb4d8" font-weight="400">→</text><text x="42" y="324" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" fill="#b2c5d5" font-weight="400">源码与发布包不包含个人布局；备份 layout.json 即可保存你的排列。</text></svg>