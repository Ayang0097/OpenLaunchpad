<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img"><title>OpenLaunchpad 功能图解</title><rect x="0" y="0" width="1200" height="510" rx="26" fill="#f3f6fa" stroke="none"/><text x="42" y="62" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="32" fill="#182c42" font-weight="650">三种常用操作</text><rect x="42" y="95" width="352" height="350" rx="20" fill="#ffffff" stroke="#dce5ee"/><text x="66" y="147" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="26" fill="#517cb0" font-weight="650">01</text><text x="66" y="197" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="28" fill="#182c42" font-weight="650">找到并打开</text><text x="66" y="259" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" fill="#384c61" font-weight="400">输入应用名称</text><text x="66" y="299" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="17" fill="#52687c" font-weight="400">按 Return 启动首个结果</text><rect x="62" y="352" width="312" height="57" rx="12" fill="#edf3fa" stroke="none"/><text x="76" y="388" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="19" fill="#325c8b" font-weight="400">搜索 → 匹配 → 打开</text><rect x="424" y="95" width="352" height="350" rx="20" fill="#ffffff" stroke="#dce5ee"/><text x="448" y="147" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="26" fill="#517cb0" font-weight="650">02</text><text x="448" y="197" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="28" fill="#182c42" font-weight="650">整理到一起</text><text x="448" y="259" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" fill="#384c61" font-weight="400">拖到目标图标中央</text><text x="448" y="299" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="17" fill="#52687c" font-weight="400">停留约 0.6 秒，出现提示后松手</text><rect x="444" y="352" width="312" height="57" rx="12" fill="#edf3fa" stroke="none"/><text x="458" y="388" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="19" fill="#325c8b" font-weight="400">拖动 → 悬停 → 合并</text><rect x="806" y="95" width="352" height="350" rx="20" fill="#ffffff" stroke="#dce5ee"/><text x="830" y="147" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="26" fill="#517cb0" font-weight="650">03</text><text x="830" y="197" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="28" fill="#182c42" font-weight="650">放到另一页</text><text x="830" y="259" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" fill="#384c61" font-weight="400">拖到页面左侧或右侧</text><text x="830" y="299" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="17" fill="#52687c" font-weight="400">停留约 0.55 秒，翻页后放置</text><rect x="826" y="352" width="312" height="57" rx="12" fill="#edf3fa" stroke="none"/><text x="840" y="388" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="19" fill="#325c8b" font-weight="400">拖动 → 边缘 → 翻页</text><text x="42" y="481" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="17" fill="#62778b" font-weight="400">交互流程示意 · 触控板手感仍在持续优化</text></svg>